version = "1.0"

[task]
name = "benchmark/zero-copy-slab-allocator-matrix"
description = "Implement and calibrate a high-performance, cache-line aligned zero-copy memory slab allocator and fragmentation compactor across a 1,000-state combinatorial permutation matrix."
difficulty = "hard"
category = "systems-programming"
timeout_sec = 2700
allow_internet = false
tags = ["systems-programming", "memory-management", "slab-allocator", "zero-copy", "cache-alignment", "compaction", "long-horizon"]

[task.difficulty_explanation]
provenance = "Synthetic 1,000-state combinatorial matrix inspired by standard architectural design patterns in operating systems kernel slab allocators (Bonwick 1994)."
differentiation_notes = "This task combines: (1) multi-class power-of-two slab arenas (32B to 4096B) with 64-byte hardware cache-line alignment; (2) explicit memory safety guards including 4-byte canary headers/footers (0xDEADBEEF) and use-after-free/double-free detection; (3) an active zero-copy fragmentation compactor and page coalescer; (4) an AST anti-cheat layer blocking external memory and database libraries; and (5) a 1,000-case combinatorial test matrix verifying allocator efficiency, memory leak avoidance, and compaction ratio under high churn."
relevance = "Evaluates low-level systems programming, memory layout modeling, fragmentation mitigation, and invariant-enforcing resource allocators."
failure_cruxes = [
    "Silent heap corruption from unaligned memory boundary arithmetic across power-of-two size classes.",
    "Canary word corruption during multi-threaded or churned deallocations causing use-after-free escapes.",
    "Sparse slab compaction deadlocks when objects are migrated between partially filled arenas."
]

[scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.50

[hardware]
cpu = 2
memory_mb = 2048

[environment]
image = "python:3.11-slim"
workdir = "/app"
